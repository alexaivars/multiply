<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="A little daily practice with the 1–9 times tables. Go in order or mix things up, at your own pace.">
  <title>Multiply — Times table practice</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Multiply home"><span class="brand-mark" aria-hidden="true">×</span> Multiply</a>
    <button id="statistics-button" type="button">Statistics</button>
  </header>
  <p id="storage-notice" class="notice" role="status" aria-live="polite" hidden></p>
  <main id="app"></main>
  <dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
    <h2 id="reset-title">Reset your statistics?</h2>
    <p id="reset-description">This removes all your saved results for Multiply in this browser. You can’t undo it.</p>
    <form method="dialog" class="answer-actions">
      <button value="cancel" autofocus>Keep my statistics</button>
      <button value="reset" class="primary">Reset statistics</button>
    </form>
  </dialog>
  <noscript><p class="notice">Please enable JavaScript to practise your times tables.</p></noscript>
</body>
</html>
